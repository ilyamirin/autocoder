[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-coding-demo"
version = "0.1.0"
description = "Autonomous coding demo stack with Kanboard, Gitea Actions, and FastAPI services."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["agents", "aider", "kanboard", "gitea", "automation", "demo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "aider-chat>=0.86.0,<1.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/example/autonomous-coding-demo"
Repository = "https://github.com/example/autonomous-coding-demo"
Documentation = "https://github.com/example/autonomous-coding-demo#readme"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
